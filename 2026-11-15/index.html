            ${art.leaderPerspectives.map(p => p.person).join(' × ')}
          </td>
          <td class="py-3 px-3 text-right whitespace-nowrap">
            <button type="button" onclick="closeMatrixAndOpen(${art.id})" class="px-3 py-1 rounded-full bg-slate-900 hover:bg-blue-700 text-white text-xs font-medium transition-colors">
              阅读 →
            </button>
          </td>
        </tr>
      `).join('');
    }

    // ==================== VIEW NAVIGATION & HANDLERS ====================
    function openArticle(id) {
      state.view = 'article';
      renderArticleDetail(id);
      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-article').classList.remove('hidden');
      const topBackBtn = document.getElementById('top-back-home-btn');
      if (topBackBtn) {
        topBackBtn.classList.remove('hidden');
        topBackBtn.classList.add('inline-flex');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showHome() {
      state.view = 'home';
      document.getElementById('view-article').classList.add('hidden');
      document.getElementById('view-home').classList.remove('hidden');
      const topBackBtn = document.getElementById('top-back-home-btn');
      if (topBackBtn) {
        topBackBtn.classList.add('hidden');
        topBackBtn.classList.remove('inline-flex');
      }
      renderHome();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setFontSize(size) {
      state.fontSize = size;
      const container = document.getElementById('view-article');
      container.classList.remove('font-scale-sm', 'font-scale-md', 'font-scale-lg');
      container.classList.add(`font-scale-${size}`);

      ['sm', 'md', 'lg'].forEach(s => {
        const btn = document.getElementById(`font-btn-${s}`);
        if (!btn) return;
        if (s === size) {
          btn.className = 'px-2.5 py-0.5 rounded-full bg-slate-900 text-white font-medium transition-colors';
        } else {
          btn.className = 'px-2.5 py-0.5 rounded-full text-slate-500 hover:text-slate-900 transition-colors';
        }
      });
    }

    function closeMatrixAndOpen(id) {
      document.getElementById('matrix-modal').classList.add('hidden');
      openArticle(id);
    }

    window.openArticle = openArticle;
    window.showHome = showHome;
    window.setFontSize = setFontSize;
    window.closeMatrixAndOpen = closeMatrixAndOpen;

    // ==================== INITIALIZATION ====================
    document.addEventListener('DOMContentLoaded', () => {
      saveReadState();
      renderHome();
      renderMatrixTable();

      document.getElementById('nav-brand-btn').addEventListener('click', showHome);
      document.getElementById('top-back-home-btn').addEventListener('click', showHome);

      const tabs = document.querySelectorAll('.cat-tab');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          state.selectedCategory = tab.getAttribute('data-cat') || 'all';
          tabs.forEach(t => {
            if (t === tab) {
              t.className = 'cat-tab px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-white transition-colors whitespace-nowrap';
            } else {
              t.className = 'cat-tab px-3.5 py-1.5 rounded-full text-xs font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors whitespace-nowrap';
            }
          });
          renderHome();
        });
      });

      const focusToggle = document.getElementById('focus-only-toggle');
      focusToggle.addEventListener('change', () => {
        state.focusOnly = focusToggle.checked;
        renderHome();
      });

      const searchInput = document.getElementById('search-input');
      const clearSearchBtn = document.getElementById('clear-search-btn');
      searchInput.addEventListener('input', () => {
        state.searchQuery = searchInput.value;
        if (state.searchQuery.length > 0) {
          clearSearchBtn.classList.remove('hidden');
        } else {
          clearSearchBtn.classList.add('hidden');
        }
        renderHome();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        state.searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        renderHome();
      });

      document.getElementById('reset-filters-btn').addEventListener('click', () => {
        state.selectedCategory = 'all';
        state.searchQuery = '';
        state.focusOnly = false;
        searchInput.value = '';
        focusToggle.checked = false;
        clearSearchBtn.classList.add('hidden');
        tabs.forEach((t, idx) => {
          if (idx === 0) {
            t.className = 'cat-tab px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-white transition-colors whitespace-nowrap';
          } else {
            t.className = 'cat-tab px-3.5 py-1.5 rounded-full text-xs font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors whitespace-nowrap';
          }
        });
        renderHome();
      });

      const matrixModal = document.getElementById('matrix-modal');
      document.getElementById('open-matrix-btn').addEventListener('click', () => {
        matrixModal.classList.remove('hidden');
      });
      document.getElementById('close-matrix-btn').addEventListener('click', () => {
        matrixModal.classList.add('hidden');
      });
      matrixModal.addEventListener('click', (e) => {
        if (e.target === matrixModal) {
          matrixModal.classList.add('hidden');
        }
      });

      document.addEventListener('keydown', (e) => {
        if (!matrixModal.classList.contains('hidden')) {
          if (e.key === 'Escape') matrixModal.classList.add('hidden');
          return;
        }
        if (state.view === 'article') {
          if (e.key === 'Escape') {
            showHome();
          } else if (e.key === 'ArrowLeft') {
            const prevId = state.activeArticleId > 1 ? state.activeArticleId - 1 : 12;
            openArticle(prevId);
          } else if (e.key === 'ArrowRight') {
            const nextId = state.activeArticleId < 12 ? state.activeArticleId + 1 : 1;
            openArticle(nextId);
          }
        }
      });
    });
  </script>
<script src="../site-nav.js"></script>
</body>
</html>
